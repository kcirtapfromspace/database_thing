apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  labels:
    app.kubernetes.io/name: postgres-db
  name: postgres-db
spec:
  replicas: 1
  # RWO volume: the old pod must release it before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-db
    spec:
      containers:
        - args: 
          - "postgres"
          - "-c" 
          - "max_connections=1000"
          - "-c"
          - "wal_level=logical"
          - "-c"
          - "log_min_error_statement=fatal"
          env:
          - name: POSTGRES_USER
            valueFrom:
                  secretKeyRef:
                    name: postgres-secret
                    key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
                  secretKeyRef:
                    name: postgres-secret
                    key: POSTGRES_PASSWORD
          - name: POSTGRES_HOST
            valueFrom:
                  secretKeyRef:
                    name: postgres-secret
                    key: POSTGRES_HOST
          - name: POSTGRES_PORT
            valueFrom:
                  secretKeyRef:
                    name: postgres-secret
                    key: POSTGRES_PORT
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata
          image: psql_db:latest
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          name: postgres-db
          ports:
            - name: postgres-psql
              containerPort: 5432
              protocol: TCP
      restartPolicy: Always
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
