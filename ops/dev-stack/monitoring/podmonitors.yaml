apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: redpanda
  namespace: kafka
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
      app.kubernetes.io/component: redpanda-statefulset
  podMetricsEndpoints:
    - port: admin
      path: /public_metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: argo-workflows-controller
  namespace: argo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: workflow-controller
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: argo-events
  namespace: argo
spec:
  selector:
    matchExpressions:
      - key: controller
        operator: In
        values: [eventsource-controller, sensor-controller]
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
