lakehouse:
  target: local
  outputs:
    local:
      type: duckdb
      path: /tmp/lakehouse.duckdb
      threads: 4
      external_root: "s3://lakehouse/marts"
      extensions:
        - httpfs
        - parquet
      settings:
        s3_access_key_id: minio-sa
        s3_secret_access_key: minio123
        s3_endpoint: minio.minio.svc.cluster.local:9000
        s3_region: us-east-1
        s3_url_style: path
        s3_use_ssl: false
        # DuckDB sizes itself from the node's memory, not the pod limit; keep it under the limit and spill instead
        memory_limit: 1500MB
        temp_directory: /tmp/duckdb_spill
        http_retries: 10
