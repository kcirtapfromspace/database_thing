version: 2

models:
  - name: fct_orders
    description: One row per order with lifecycle timings, margin, payment and fulfillment details.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: total
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
  - name: dim_customers
    description: Customers with lifetime value and RFM segment.
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: rfm_segment
        tests:
          - accepted_values:
              values: [Prospect, Champion, Loyal, Big Spender, New, At Risk, Hibernating, Needs Attention]
  - name: fct_daily_kpis
    description: Daily traffic, revenue, conversion and payment health.
    columns:
      - name: date
        tests: [unique, not_null]
      - name: conversion_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
  - name: fct_funnel_daily
    description: Session funnel by day, device and acquisition channel.
  - name: fct_cohort_retention
    description: Weekly first-purchase cohorts and their repeat behaviour.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cohort_week, week_number]
    columns:
      - name: retention_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
  - name: fct_payment_health_daily
    description: Payment approval and decline rates by day, provider and method.
    columns:
      - name: decline_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
  - name: fct_category_daily
    description: Revenue, units and margin by day and product category.
  - name: fct_product_performance
    description: Views, cart adds and sales per product.
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: fct_fulfillment
    description: Shipping speed by carrier, service level and destination.
  - name: pipeline_freshness
    description: When the lakehouse was last refreshed and what triggered it.
