name: lakehouse
version: '2.0'
profile: lakehouse
config-version: 2
require-dbt-version: [">=1.7.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
packages-install-path: dbt_packages
clean-targets: [target, dbt_packages, logs]

flags:
  send_anonymous_usage_stats: false

vars:
  # set by the Argo workflow so marts record what triggered the refresh
  triggered_by: manual

models:
  lakehouse:
    # tables, not views: each run reads every raw source from S3 exactly once
    staging:
      +materialized: table
    intermediate:
      +materialized: table
    marts:
      # written back to the lakehouse as Parquet (s3://lakehouse/marts/<model>.parquet)
      +materialized: external
      +format: parquet
