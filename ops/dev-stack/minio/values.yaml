clusterDomain: miniocluster.local

## Set default image, imageTag, and imagePullPolicy. mode is used to indicate the
##
image:
  # MinIO no longer publishes public images on quay.io / Docker Hub; use Chainguard's build
  repository: cgr.dev/chainguard/minio
  tag: latest-dev
  pullPolicy: IfNotPresent

mcImage:
  repository: cgr.dev/chainguard/minio-client
  tag: latest-dev
  pullPolicy: IfNotPresent

mode: standalone ## other supported values are "standalone"
## Internal port number for MinIO S3 API container
## Change service.port to change external port number
minioAPIPort: "9000"

## Internal port number for MinIO Browser Console container
## Change consoleService.port to change external port number
minioConsolePort: "9001"
## Set default rootUser, rootPassword
## AccessKey and secretKey is generated when not set
## Distributed MinIO ref: https://min.io/docs/minio/linux/operations/install-deploy-manage/deploy-minio-multi-node-multi-drive.html
##
rootUser: "rootuser"
rootPassword: "rootpass123"
# Number of MinIO containers running
replicas: 1
## Enable persistence using Persistent Volume Claims
## ref: http://kubernetes.io/docs/user-guide/persistent-volumes/
##
# the lakehouse, Argo artifacts and RisingWave state all live here; keep them across pod restarts
persistence:
  enabled: true
  size: 20Gi
resources:
  requests:
    memory: "256Mi"
  limits:
    memory: "512Mi"

users:
  ## Username, password and policy to be assigned to the user
  ## Default policies are [readonly|readwrite|writeonly|consoleAdmin|diagnostics]
  ## Add new policies as explained here https://min.io/docs/minio/kubernetes/upstream/administration/identity-access-management.html#access-management
  ## NOTE: this will fail if LDAP is enabled in your MinIO deployment
  ## make sure to disable this if you are using LDAP.
  - accessKey: minio
    secretKey: minio123
    policy: readwrite
  # Or you can refer to specific secret
  #- accessKey: externalSecret
  #  existingSecret: my-secret
  #  existingSecretKey: password
  #  policy: readonly

## Additional Annotations for the Kubernetes Job makeUserJob
makeUserJob:
  securityContext:
    enabled: false
    runAsUser: 1000
    runAsGroup: 1000
  resources:
    requests:
      memory: 128Mi
  # Command to run after the main command on exit
  exitCommand: ""
  
## List of service accounts to be created after minio install
##
svcaccts:
  ## accessKey, secretKey and parent user to be assigned to the service accounts
  ## Add new service accounts as explained here https://min.io/docs/minio/kubernetes/upstream/administration/identity-access-management/minio-user-management.html#service-accounts
  - accessKey: minio-sa
    secretKey: minio123
    user: minio
    # policy: readwrite
  ## Or you can refer to specific secret
  # - accessKey: externalSecret
  #   existingSecret: my-secret
  #   existingSecretKey: password
  #   user: console
  ## You also can pass custom policy
  # - accessKey: console-svcacct
  #   secretKey: console123
  #   user: console
  #     statements:
  #       - resources:
  #           - 'arn:aws:s3:::example*/*'
  #         actions:
  #           - "s3:AbortMultipartUpload"
  #           - "s3:GetObject"
  #           - "s3:DeleteObject"
  #           - "s3:PutObject"
  #           - "s3:ListMultipartUploadParts"

makeServiceAccountJob:
  securityContext:
    enabled: false
    runAsUser: 1000
    runAsGroup: 1000
  resources:
    requests:
      memory: 50Mi
  # Command to run after the main command on exit
  exitCommand: ""

## List of buckets to be created after minio install
##
buckets:
    # Name of the bucket
  - name: lakehouse
    # Policy to be set on the
    # bucket [none|download|upload|public]
    policy: public
    # Purge if bucket exists already
    purge: false
    # set versioning for
    # bucket [true|false]
    versioning: true
    # set objectlocking for
    # bucket [true|false] NOTE: versioning is enabled by default if you use locking
    objectlocking: false
    
  - name: risingwave
    policy: none
    purge: false
    versioning: false
    objectlocking: false
  - name: argo-artifacts
    policy: public
    purge: false
    versioning: false
    objectlocking: false

## Additional Annotations for the Kubernetes Job makeBucketJob
makeBucketJob:
  securityContext:
    enabled: false
    runAsUser: 1000
    runAsGroup: 1000
  resources:
    requests:
      memory: 50Mi
  # Command to run after the main command on exit
  exitCommand: ""

## Chainguard mc runs as non-root; the chart's setup scripts write mc config under /etc/minio
postJob:
  securityContext:
    enabled: true
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0
