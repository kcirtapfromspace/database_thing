# EventSources and Sensors run as argo-events-runner: leader election (leases) and
# submitting workflows. The workflows themselves run as argo-workflow.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-events-runner
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-events-runner
  namespace: argo
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows, workflowtemplates]
    verbs: [create, get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-events-runner
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-events-runner
subjects:
  - kind: ServiceAccount
    name: argo-events-runner
    namespace: argo
